name: release

on:
  push:
  pull_request:

jobs:
  build:
    name: build-windows
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Release
      run: dotnet build RoundedTB.sln -c Release --nologo

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RoundedTB-Release-${{ github.sha }}
        path: |
          RoundedTB/bin/Release/net10.0-windows10.0.19041.0/**
        if-no-files-found: error
